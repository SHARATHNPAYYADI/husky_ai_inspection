<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Husky Inspection Report</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 40px;
    background: #f7f9fb;
    color: #333;
  }

  h1 {
    text-align: center;
    margin-bottom: 5px;
  }

  .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
  }

  .summary {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
  }

  .card {
    flex: 1;
    margin: 0 10px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .card h2 {
    margin: 0;
    font-size: 22px;
  }

  .card p {
    margin: 5px 0 0;
    color: #777;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
  }

  th {
    background: #f0f2f5;
    padding: 12px;
    text-align: left;
  }

  td {
    padding: 12px;
    border-top: 1px solid #eee;
    vertical-align: middle;
  }

  img {
    width: 180px;
    border-radius: 8px;
  }

  .found {
    color: green;
    font-weight: bold;
  }

  .missing {
    color: red;
    font-weight: bold;
  }

  tr.missing-row {
    background-color: #ffecec;
  }

</style>
</head>

<body>

<h1>Husky Inspection Report</h1>
<div style="text-align:right; margin-bottom:20px;">
  <button onclick="window.print()" style="
    padding:10px 16px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
  ">
    Download PDF
  </button>
</div>
<div class="subtitle">
  Generated: {{generated_time}}
</div>

<div class="summary">
  <div class="card">
    <h2>{{total_points}}</h2>
    <p>Total Points</p>
  </div>

  <div class="card">
    <h2>{{inspected}}</h2>
    <p>Inspected</p>
  </div>

  <div class="card">
    <h2>{{detected}}</h2>
    <p>Detected</p>
  </div>

  <div class="card">
    <h2>{{missing}}</h2>
    <p>Missing</p>
  </div>
</div>

<table>
  <tr>
    <th>Point</th>
    <th>Image</th>
    <th>Result</th>
    <th>Time</th>
  </tr>

  {{rows}}

</table>

</body>
</html>
