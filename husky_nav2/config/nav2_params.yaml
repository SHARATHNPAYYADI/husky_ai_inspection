amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    odom_topic: /odom
    min_particles: 500
    max_particles: 5000
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    z_hit: 0.7
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2
    sigma_hit: 0.2
    laser_model_type: likelihood_field
    laser_max_range: 20.0
    max_beams: 720
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 2.0
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    set_initial_pose: false
    initial_pose:
      x: 4.728710
      y: 0.853721
      z: 0.0
      yaw: 1.57234

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/ubuntu/husky_ws/src/husky_ai_inspection/husky_nav2/maps/small_factory.yaml

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid

      tolerance: 0.2
      downsample_costmap: false
      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0

      motion_model_for_search: "DUBIN"

      angle_quantization_bins: 72

      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0

      minimum_turning_radius: 0.4

      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0       # ✅ back to 20Hz — Isaac Sim handles this fine
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 15.0  # ✅ more time before declaring failure

    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3 #0.10
      yaw_goal_tolerance: 0.5
      stateful: true                 # ✅ FIXED: prevents XY/yaw re-checking loop

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.8
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 2.0

      # ✅ Rotation tuning — the core fix
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5   # ✅ raised from 0.785 (~45°) to ~69°
                                          #    robot arcs longer before pivoting
      rotate_to_heading_angular_vel: 1.0  # ✅ reduced from 0.8 — smoother pivot

      # ✅ Approach tuning
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0

      # ✅ Velocity scaling
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25

      # ✅ Dynamics — increased accel so robot can actually reach commanded vel
      max_angular_accel: 2.0             # ✅ raised from 1.0
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      allow_reversing: false

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator/NavigateThroughPosesNavigator

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0             # ✅ halved to avoid contention with controller
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8          # ✅ raised — 0.3 was too slow to complete spin recovery
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5          # ✅ slightly raised to match new max_angular_accel

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0         # ✅ restored to 10Hz — 5Hz was too sluggish
      publish_frequency: 5.0         # ✅ raised from 2Hz
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 2.0
      rolling_window: true
      width: 10                      # ✅ reduced from 20 — 20m was causing far-obstacle influence
      height: 10                     # ✅ reduced from 20
      resolution: 0.05
      robot_radius: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          marking: true
          clearing: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      transform_tolerance: 2.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.5
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

collision_monitor:
  ros__parameters:
    use_sim_time: true