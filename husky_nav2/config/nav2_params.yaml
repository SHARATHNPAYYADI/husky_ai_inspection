amcl:
  ros__parameters:
    use_sim_time: true

    # Frames
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    odom_topic: /odometry/filtered

    # Particle count (critical)
    min_particles: 800
    max_particles: 4000

    # Motion model (VERY important for rotation)
    alpha1: 0.4   # rot -> rot
    alpha2: 0.4   # rot -> trans
    alpha3: 0.2   # trans -> trans
    alpha4: 0.2   # trans -> rot
    alpha5: 0.1

    z_hit: 0.7
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.2

    sigma_hit: 0.2

    # Laser model
    laser_model_type: likelihood_field
    laser_max_range: 30.0
    max_beams: 60

    # Beam skipping (helps during fast rotation)
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Update thresholds
    update_min_d: 0.05
    update_min_a: 0.1

    resample_interval: 1
    transform_tolerance: 0.3

    # Recovery
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/sharathnpayyadi/husky_ws/src/husky_ai_inspection/husky_nav2/maps/gazebo_world/my_map.yaml

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 5

behavior_server:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      robot_base_frame: base_link
      global_frame: odom
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      robot_base_frame: base_link
      global_frame: map
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
